server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:8h}
      cookie:
        name: GESTAO_SESSION
        http-only: true
        same-site: lax
        secure: ${APP_COOKIE_SECURE:false}
        path: /

spring:
  application:
    name: gestao-empresarial
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao}
    username: ${DB_USERNAME:gestao}
    password: ${DB_PASSWORD:gestao}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8443,http://127.0.0.1:8443}
  security:
    cookie-secure: ${APP_COOKIE_SECURE:false}
  seed:
    demo: ${APP_SEED_DEMO:true}
    password: ${APP_SEED_PASSWORD:gestao123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.empresa.gestao: INFO
