services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao}
      POSTGRES_USER: ${POSTGRES_USER:-gestao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gestao-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestao} -d ${POSTGRES_DB:-gestao}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gestao-postgres-data:
